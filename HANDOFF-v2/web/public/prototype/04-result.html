<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Project Drive — Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0E13;--bg-2:#12151B;--panel:#171B22;--panel-2:#1E232B;
  --line:#242A33;--line-2:#2E353F;
  --text:#F1EEE8;--text-2:#9A9EA5;--text-3:#5E636A;
  --accent:#E5533B;--accent-2:#F0664C;--accent-soft:rgba(229,83,59,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
::selection{background:rgba(229,83,59,.28);}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px;}
@media(max-width:640px){.wrap{padding:0 16px;}}

/* nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;}
.brand svg{width:20px;height:20px;}
.credits{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;}
.credits svg{width:13px;height:13px;color:var(--accent);}

/* head */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:14px 0 20px;}
.head h1{font-size:23px;font-weight:800;letter-spacing:-0.01em;}
.head .sub{color:var(--text-2);font-size:14px;margin-top:6px;}
.head-btns{display:flex;gap:9px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:11px 18px;border-radius:9px;border:1px solid transparent;transition:.15s;}
.btn svg{width:16px;height:16px;}
.btn-gold{background:var(--accent);color:#180A06;}
.btn-gold:hover{background:var(--accent-2);}
.btn-line{background:var(--panel);border-color:var(--line);color:var(--text);}
.btn-line:hover{border-color:var(--line-2);}
.btn-ghost{background:transparent;color:var(--text-2);}
.btn-ghost:hover{color:var(--text);}

/* compare */
.compare{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0C0D0F;position:relative;}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;user-select:none;
  background:radial-gradient(75% 60% at 50% 42%, #1D2025 0%, #0D0E10 72%);}
.stage svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:82%;height:auto;filter:drop-shadow(0 26px 34px rgba(0,0,0,.5));}
.before{position:absolute;inset:0;overflow:hidden;width:50%;}
.before .inner{position:absolute;top:0;left:0;height:100%;}
.divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--accent);transform:translateX(-1px);}
.handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:ew-resize;box-shadow:0 4px 14px rgba(0,0,0,.4);}
.handle svg{width:20px;height:20px;color:#180A06;}
.tag{position:absolute;top:14px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:5px 11px;border-radius:99px;background:rgba(12,13,15,.7);backdrop-filter:blur(6px);border:1px solid var(--line);}
.tag.b{left:14px;}.tag.a{right:14px;}
.range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0;}

/* actions */
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;}

/* applied meta */
.meta{display:flex;gap:32px;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:1px solid var(--line);}
.meta .i span{display:block;color:var(--text-3);font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.meta .i b{font-size:14px;font-weight:600;}

footer{margin-top:50px;padding:24px 0 40px;color:var(--text-3);font-size:12.5px;text-align:center;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em;}
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 15l2.4-6C6 7.6 7.2 7 8.6 7h6.8c1.4 0 2.6.6 3.2 2l2.4 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="15.5" r="2.2" stroke="var(--accent)" stroke-width="1.5"/><circle cx="17" cy="15.5" r="2.2" stroke="var(--accent)" stroke-width="1.5"/></svg>
      Project Drive
    </div>
    <div class="credits"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg>78</div>
  </nav>

  <div class="head">
    <div>
      <h1>BMW M4 Competition — Version 4</h1>
      <div class="sub">Racing Green · Satin wrap &nbsp;·&nbsp; Limo tint &nbsp;·&nbsp; BMW 437M wheels</div>
    </div>
    <div class="head-btns">
      <button class="btn btn-line"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-9 9M6 5l9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" transform="rotate(45 12 12)"/></svg>Continue editing</button>
      <button class="btn btn-gold"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Save to garage</button>
    </div>
  </div>

  <!-- BEFORE / AFTER -->
  <div class="compare">
    <div class="stage" id="stage">
      <!-- AFTER (full, underneath) -->
      <svg id="after" viewBox="0 0 800 300"></svg>
      <!-- BEFORE (clipped left half, on top) -->
      <div class="before" id="before"><div class="inner" id="beforeInner"><svg id="beforeCar" viewBox="0 0 800 300"></svg></div></div>
      <div class="tag b">BEFORE</div>
      <div class="tag a">AFTER</div>
      <div class="divider" id="divider"></div>
      <div class="handle" id="handle"><svg viewBox="0 0 24 24" fill="none"><path d="M9 7l-4 5 4 5M15 7l4 5-4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <input class="range" id="range" type="range" min="0" max="100" value="50" aria-label="Compare before and after">
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-line"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11M12 15l-4-4M12 15l4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Download</button>
    <button class="btn btn-line"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0113.7-5.7M20 12a8 8 0 01-13.7 5.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M17 3v4h-4M7 21v-4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Regenerate <span class="mono" style="color:var(--text-3);font-size:12px;">· 25 cr</span></button>
    <button class="btn btn-line"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>Duplicate as new variation</button>
    <button class="btn btn-ghost"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3v13M12 3L8 7M12 3l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Share link</button>
  </div>

  <div class="meta">
    <div class="i"><span>Wrap</span><b>Racing Green · Satin</b></div>
    <div class="i"><span>Tint</span><b>Limo (20%)</b></div>
    <div class="i"><span>Wheels</span><b>BMW 437M</b></div>
    <div class="i"><span>Cost</span><b>55 credits</b></div>
    <div class="i"><span>Created</span><b>Today · 14:02</b></div>
  </div>

  <footer>Preview build · the car shown is a placeholder illustration</footer>
</div>

<script>
function lighten(h,a){const n=parseInt(h.slice(1),16);let r=(n>>16)+a*2.4,g=((n>>8)&255)+a*2.4,b=(n&255)+a*2.4;return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function darken(h,a){return lighten(h,-a);}
function carSVG(body,wheelCol,tinted){
  const glass=tinted?'#12171B':'#2A333C';
  return `<defs><linearGradient id="g_${body.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${lighten(body,20)}"/><stop offset="55%" stop-color="${body}"/><stop offset="100%" stop-color="${darken(body,24)}"/></linearGradient></defs>
  <path d="M92 206 C97 165 140 142 198 138 L252 104 C266 95 288 90 310 90 L470 90 C500 90 524 98 543 116 L598 150 C656 154 700 170 710 202 L712 210 L694 210 C694 191 677 178 656 178 C635 178 618 191 618 210 L282 210 C282 191 265 178 244 178 C223 178 206 191 206 210 L94 210 Z" fill="url(#g_${body.slice(1)})" stroke="${darken(body,38)}" stroke-width="2"/>
  <path d="M260 138 L292 108 C302 99 316 94 330 94 L452 94 C470 94 486 100 498 112 L527 138 Z" fill="${glass}" stroke="${darken(body,38)}" stroke-width="1.5"/>
  <ellipse cx="104" cy="176" rx="9" ry="6" fill="#F4E7C9" opacity=".9"/><rect x="696" y="170" width="13" height="7" rx="2" fill="#7A1414"/>
  ${wh(244,wheelCol)}${wh(656,wheelCol)}`;
}
function wh(cx,c){return `<circle cx="${cx}" cy="210" r="40" fill="#0F1113"/><circle cx="${cx}" cy="210" r="24" fill="${c}"/><g stroke="${darken(c,22)}" stroke-width="2.4"><line x1="${cx}" y1="190" x2="${cx}" y2="230"/><line x1="${cx-20}" y1="210" x2="${cx+20}" y2="210"/><line x1="${cx-14}" y1="196" x2="${cx+14}" y2="224"/><line x1="${cx+14}" y1="196" x2="${cx-14}" y2="224"/></g><circle cx="${cx}" cy="210" r="6" fill="#0C0E13"/>`;}

// BEFORE = оригинал (серебристая заводская), AFTER = результат (зелёный сатин, тонировка, диски)
document.getElementById('after').innerHTML     = carSVG('#3E5B44','#9A9C9F',true);
document.getElementById('beforeCar').innerHTML = carSVG('#B9BCC1','#B9BCC1',false);

// ---- ползунок сравнения "было / стало" ----
const stage=document.getElementById('stage');
const before=document.getElementById('before');
const beforeInner=document.getElementById('beforeInner');
const divider=document.getElementById('divider');
const handle=document.getElementById('handle');
const range=document.getElementById('range');

function setSplit(pct){
  pct=Math.max(0,Math.min(100,pct));
  before.style.width=pct+'%';
  divider.style.left=pct+'%';
  handle.style.left=pct+'%';
  // внутреннюю "before"-машину держим на всю ширину сцены, чтобы она не сжималась при обрезке
  beforeInner.style.width=stage.clientWidth+'px';
}
range.addEventListener('input',()=>setSplit(+range.value));
window.addEventListener('resize',()=>setSplit(+range.value));
setSplit(50);
</script>
</body>
</html>
