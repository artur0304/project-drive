<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Project Drive — Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0E13;--panel:#171B22;--panel-2:#1E232B;--line:#242A33;--line-2:#2E353F;
  --text:#F1EEE8;--text-2:#9A9EA5;--text-3:#5E636A;
  --accent:#E5533B;--accent-2:#F0664C;--accent-soft:rgba(229,83,59,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
::selection{background:rgba(227,183,94,.25);}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
@media(max-width:640px){.wrap{padding:0 16px;}}

nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;}
.brand svg{width:20px;height:20px;}
.nav-links{display:flex;gap:22px;align-items:center;}
.nav-links a{color:var(--text-2);font-size:14px;font-weight:500;}
.nav-links a.on{color:var(--text);}
.nav-links a:hover{color:var(--text);}
.credits{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;}
.credits svg{width:13px;height:13px;color:var(--accent);}

.head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 24px;flex-wrap:wrap;gap:14px;}
.head h1{font-size:26px;font-weight:800;letter-spacing:-0.01em;}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:11px 18px;border-radius:9px;border:1px solid transparent;transition:.15s;}
.btn svg{width:16px;height:16px;}
.btn-gold{background:var(--accent);color:#180A06;}
.btn-gold:hover{background:var(--accent-2);}

.car-block{margin-bottom:40px;}
.car-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.car-head .l{display:flex;align-items:baseline;gap:12px;}
.car-head h2{font-size:18px;font-weight:700;}
.car-head .count{color:var(--text-3);font-size:13px;}
.car-head a{color:var(--text-2);font-size:13.5px;font-weight:600;}
.car-head a:hover{color:var(--text);}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:440px){.grid{grid-template-columns:1fr;}}

.ver{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);transition:.15s;cursor:pointer;position:relative;}
.ver:hover{border-color:var(--line-2);transform:translateY(-2px);}
.ver .img{aspect-ratio:4/3;background:radial-gradient(75% 65% at 50% 40%,#1D2025,#0D0E10);display:flex;align-items:center;justify-content:center;}
.ver .img svg{width:82%;}
.ver .info{padding:12px 14px 14px;}
.ver .info b{font-size:13.5px;display:block;}
.ver .info span{font-size:11.5px;color:var(--text-3);}
.badge{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);}
.badge.src{background:var(--accent-soft);border-color:rgba(229,83,59,.4);color:var(--accent);}

/* add-new tile */
.add{border:1.5px dashed var(--line-2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);background:transparent;min-height:100%;transition:.15s;}
.add:hover{border-color:var(--accent);color:var(--accent);}
.add svg{width:26px;height:26px;}
.add span{font-size:12.5px;font-weight:600;}

footer{margin-top:40px;padding:24px 0 50px;color:var(--text-3);font-size:12.5px;text-align:center;border-top:1px solid var(--line);}

/* ---- нарисованное окружение "гараж" (фон за контентом) ---- */
.env{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.env svg{width:100%;height:100%;}
.wrap{position:relative;z-index:1;}
/* карточки чуть плотнее, чтобы читались поверх фона */
.ver,.credits{backdrop-filter:blur(2px);}
</style>
</head>
<body>
<!-- ФОН: нарисованный гараж-бокс (стены, пол, лампы). Атмосфера, не фото. -->
<div class="env" id="env" aria-hidden="true"></div>

<div class="wrap">
  <nav>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 15l2.4-6C6 7.6 7.2 7 8.6 7h6.8c1.4 0 2.6.6 3.2 2l2.4 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="15.5" r="2.2" stroke="var(--accent)" stroke-width="1.5"/><circle cx="17" cy="15.5" r="2.2" stroke="var(--accent)" stroke-width="1.5"/></svg>
      Project Drive
    </div>
    <div class="nav-links">
      <a href="#" class="on">Garage</a>
      <a href="#">Credits</a>
      <a href="#">Account</a>
      <div class="credits"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg>103</div>
    </div>
  </nav>

  <div class="head">
    <h1>Your garage</h1>
    <button class="btn btn-gold"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Upload a car</button>
  </div>

  <!-- CAR 1 -->
  <div class="car-block">
    <div class="car-head">
      <div class="l"><h2>BMW M4 Competition</h2><span class="count">4 versions</span></div>
      <a href="#">Open in configurator →</a>
    </div>
    <div class="grid" id="g1"></div>
  </div>

  <!-- CAR 2 -->
  <div class="car-block">
    <div class="car-head">
      <div class="l"><h2>Porsche 911 Carrera</h2><span class="count">2 versions</span></div>
      <a href="#">Open in configurator →</a>
    </div>
    <div class="grid" id="g2"></div>
  </div>

  <footer>Preview build · cars shown are placeholder illustrations</footer>
</div>

<script>
function lighten(h,a){const n=parseInt(h.slice(1),16);let r=(n>>16)+a*2.4,g=((n>>8)&255)+a*2.4,b=(n&255)+a*2.4;return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function darken(h,a){return lighten(h,-a);}
function carSVG(body,wheelCol,tinted){
  const glass=tinted?'#12171B':'#2A333C';const id='g'+body.slice(1)+wheelCol.slice(1);
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${lighten(body,20)}"/><stop offset="55%" stop-color="${body}"/><stop offset="100%" stop-color="${darken(body,24)}"/></linearGradient></defs>
  <path d="M92 206 C97 165 140 142 198 138 L252 104 C266 95 288 90 310 90 L470 90 C500 90 524 98 543 116 L598 150 C656 154 700 170 710 202 L712 210 L94 210 Z" fill="url(#${id})" stroke="${darken(body,38)}" stroke-width="2"/>
  <path d="M260 138 L292 108 C302 99 316 94 330 94 L452 94 C470 94 486 100 498 112 L527 138 Z" fill="${glass}"/>
  ${wh(244,wheelCol)}${wh(656,wheelCol)}`;
}
function wh(cx,c){return `<circle cx="${cx}" cy="210" r="36" fill="#0F1113"/><circle cx="${cx}" cy="210" r="21" fill="${c}"/><circle cx="${cx}" cy="210" r="5" fill="#0C0E13"/>`;}

// машина 1 — версии
const v1=[
  {t:'Original',s:'Unedited photo',body:'#B9BCC1',wheel:'#B9BCC1',tint:false,badge:'Source',src:true},
  {t:'Version 4',s:'Racing Green · Satin',body:'#3E5B44',wheel:'#9A9C9F',tint:true,badge:'55 cr'},
  {t:'Version 3',s:'Jet Black · Gloss',body:'#161616',wheel:'#3A3D42',tint:true,badge:'25 cr'},
  {t:'Version 2',s:'Black wheels',body:'#B9BCC1',wheel:'#161616',tint:false,badge:'10 cr'},
];
const v2=[
  {t:'Original',s:'Unedited photo',body:'#9C2B2B',wheel:'#9C2B2B',tint:false,badge:'Source',src:true},
  {t:'Version 1',s:'Alpine White',body:'#D9D2C4',wheel:'#3A3D42',tint:false,badge:'25 cr'},
];

function render(id,list){
  const el=document.getElementById(id);
  list.forEach(v=>{
    const d=document.createElement('div');d.className='ver';
    d.innerHTML=`<div class="img"><svg viewBox="0 0 800 300">${carSVG(v.body,v.wheel,v.tint)}</svg></div>
      <div class="info"><b>${v.t}</b><span>${v.s}</span><br><span class="badge ${v.src?'src':''}">${v.badge}</span></div>`;
    el.appendChild(d);
  });
  // плитка "добавить новый вариант"
  const add=document.createElement('button');add.className='add';
  add.innerHTML=`<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>New variation</span>`;
  el.appendChild(add);
}
render('g1',v1);
render('g2',v2);


// ================= ЧЕРТЁЖНЫЙ ФОН НА ВСЮ ВЫСОТУ =================
// Рисуем длинное полотно = высоте всей страницы, схемы раскидываем случайно
// сверху донизу, чтобы при прокрутке попадались РАЗНЫЕ детали (без повторов).
const BP_DEFS = `
<defs>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 H0 V46" fill="none" stroke="#5A636C" stroke-width="0.6"/></pattern>
  <g id="bp-car" fill="none" stroke="#6B7783" stroke-width="1.6" stroke-linejoin="round">
    <path d="M6 62 C10 40 34 26 66 24 L92 4 C100 -1 110 -3 120 -3 L214 -3 C230 -3 243 2 251 12 L278 30 C312 33 336 42 342 60 L344 70 L6 70 Z"/>
    <path d="M96 24 L118 5 C124 0 132 -3 140 -3 L206 -3 C217 -3 226 0 232 8 L250 24 Z"/>
    <circle cx="72" cy="70" r="26"/><circle cx="72" cy="70" r="17"/><circle cx="72" cy="70" r="5"/>
    <circle cx="278" cy="70" r="26"/><circle cx="278" cy="70" r="17"/><circle cx="278" cy="70" r="5"/>
    <line x1="6" y1="88" x2="344" y2="88" stroke-dasharray="2 5" stroke-width="1"/>
    <text x="150" y="100" fill="#6B7783" font-size="9" font-family="monospace">4794 mm</text>
  </g>
  <g id="bp-wheel" fill="none" stroke="#6B7783" stroke-width="1.6">
    <circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="47"/><circle cx="60" cy="60" r="16"/><circle cx="60" cy="60" r="6"/>
    <g stroke-width="1.3"><line x1="60" y1="13" x2="60" y2="107"/><line x1="13" y1="60" x2="107" y2="60"/><line x1="27" y1="27" x2="93" y2="93"/><line x1="93" y1="27" x2="27" y2="93"/></g>
    <g fill="#6B7783"><circle cx="60" cy="44" r="2.4"/><circle cx="75" cy="55" r="2.4"/><circle cx="69" cy="73" r="2.4"/><circle cx="51" cy="73" r="2.4"/><circle cx="45" cy="55" r="2.4"/></g>
    <text x="96" y="53" fill="#6B7783" font-size="9" font-family="monospace">R20</text>
  </g>
  <g id="bp-caliper" fill="none" stroke="#6B7783" stroke-width="1.6"><path d="M8 8 Q0 40 8 72 L40 72 Q30 40 40 8 Z"/><circle cx="24" cy="26" r="3"/><circle cx="24" cy="54" r="3"/><line x1="14" y1="40" x2="34" y2="40" stroke-width="1"/></g>
  <g id="bp-bolt" fill="none" stroke="#6B7783" stroke-width="1.4"><path d="M12 2 L22 8 L22 20 L12 26 L2 20 L2 8 Z"/><circle cx="12" cy="14" r="5"/></g>
  <g id="bp-shock" fill="none" stroke="#6B7783" stroke-width="1.4"><line x1="12" y1="0" x2="12" y2="14"/><circle cx="12" cy="4" r="4"/><path d="M2 14 h20 M2 22 h20 M2 30 h20 M2 38 h20 M2 46 h20 M2 54 h20"/><line x1="12" y1="54" x2="12" y2="66"/><circle cx="12" cy="62" r="4"/></g>
  <g id="bp-dim" stroke="#6B7783" stroke-width="1"><line x1="0" y1="0" x2="80" y2="0"/><path d="M0 0 l7 -3 v6 z" fill="#6B7783"/><path d="M80 0 l-7 -3 v6 z" fill="#6B7783"/></g>
</defs>`;

function rand(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function buildBlueprint(){
  const env=document.getElementById('env');
  const W=Math.max(document.documentElement.clientWidth, window.innerWidth||0);
  const H=Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  let out=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
  out+=BP_DEFS;
  // мелкая сетка
  out+=`<rect width="${W}" height="${H}" fill="url(#grid)" opacity="0.09"/>`;
  // опорные оси через всю высоту
  out+=`<g stroke="#6B7783" stroke-width="1" stroke-dasharray="2 7" opacity="0.16">`;
  for(let x=W*0.25;x<W;x+=W*0.28){out+=`<line x1="${x.toFixed(0)}" y1="0" x2="${x.toFixed(0)}" y2="${H}"/>`;}
  for(let y=220;y<H;y+=240){out+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;}
  out+=`</g>`;
  // раскидываем схемы по всей высоте
  out+=`<g opacity="0.22">`;
  // машины — редко, крупно
  const cars=Math.max(3,Math.round(H/460));
  for(let i=0;i<cars;i++){out+=`<use href="#bp-car" transform="translate(${rand(-30,W-260).toFixed(0)} ${rand(40,H-80).toFixed(0)}) scale(${rand(0.6,1.2).toFixed(2)}) rotate(${rand(-5,5).toFixed(0)})"/>`;}
  // диски — часто
  const wheels=Math.max(8,Math.round(H/150));
  for(let i=0;i<wheels;i++){out+=`<use href="#bp-wheel" transform="translate(${rand(0,W-60).toFixed(0)} ${rand(0,H-60).toFixed(0)}) scale(${rand(0.5,1.15).toFixed(2)}) rotate(${rand(-15,15).toFixed(0)})"/>`;}
  // суппорты
  const cal=Math.max(4,Math.round(H/360));
  for(let i=0;i<cal;i++){out+=`<use href="#bp-caliper" transform="translate(${rand(0,W-40).toFixed(0)} ${rand(0,H-70).toFixed(0)}) scale(${rand(0.9,1.4).toFixed(2)}) rotate(${rand(-20,20).toFixed(0)})"/>`;}
  // амортизаторы
  const sh=Math.max(3,Math.round(H/420));
  for(let i=0;i<sh;i++){out+=`<use href="#bp-shock" transform="translate(${rand(0,W-24).toFixed(0)} ${rand(0,H-70).toFixed(0)}) scale(${rand(0.9,1.2).toFixed(2)}) rotate(${rand(-8,8).toFixed(0)})"/>`;}
  // болты — много мелочи
  const bolts=Math.max(10,Math.round(H/110));
  for(let i=0;i<bolts;i++){out+=`<use href="#bp-bolt" transform="translate(${rand(0,W-24).toFixed(0)} ${rand(0,H-28).toFixed(0)}) rotate(${rand(0,60).toFixed(0)})"/>`;}
  // размерные стрелки
  const dims=Math.max(4,Math.round(H/300));
  for(let i=0;i<dims;i++){out+=`<use href="#bp-dim" transform="translate(${rand(0,W-90).toFixed(0)} ${rand(0,H).toFixed(0)}) rotate(${pick([0,0,90]).toFixed(0)})"/>`;}
  out+=`</g></svg>`;
  env.innerHTML=out;
}

// строим после отрисовки контента; и перестраиваем при изменении размера
window.addEventListener('load',buildBlueprint);
buildBlueprint();
let _t;window.addEventListener('resize',()=>{clearTimeout(_t);_t=setTimeout(buildBlueprint,200);});

</script>
</body>
</html>
